title: Active Directory Privileged Group or Domain Controller Discovery
id: 1b8f3e6a-7c2d-4f9b-a4e1-5d0c8b3f7a92
status: experimental
description: >
  Detects enumeration of privileged domain groups and domain controllers
  using net.exe and nltest.exe.
references:
    - https://attack.mitre.org/techniques/T1069/002/
    - https://attack.mitre.org/techniques/T1018/
author: Kelvin Santos (@kelvinzdk)
date: 2026-11-24
tags:
    - attack.discovery
    - attack.t1069.002
    - attack.t1018
logsource:
    category: process_creation
    product: windows
detection:
    selection_net_img:
        - Image|endswith:
            - '\net.exe'
            - '\net1.exe'
        - OriginalFileName:
            - 'net.exe'
            - 'net1.exe'
    selection_net_cmd:
        CommandLine|contains|all:
            - ' group'
            - '/domain'
        CommandLine|contains:
            - 'domain admins'
            - 'enterprise admins'
            - 'domain computers'
            - 'domain controllers'
    selection_nltest_img:
        - Image|endswith: '\nltest.exe'
        - OriginalFileName: 'nltestrk.exe'
    selection_nltest_cmd:
        CommandLine|contains:
            - '/dclist'
            - '/domain_trusts'
            - '/dsgetdc'
    condition: (selection_net_img and selection_net_cmd) or (selection_nltest_img and selection_nltest_cmd)
falsepositives:
    - Administrators and helpdesk troubleshooting AD
    - Identity and inventory tooling
level: medium